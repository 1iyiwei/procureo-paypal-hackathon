[project]
name = "intent-agent"
version = "0.1.0"
description = "Telegram shopping agent that buys within user-set limits, with PayPal checkout"
authors = [
    { name = "Li-Yi Wei", email = "git@liyiwei.org" }
]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
intent-agent = "intent_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
